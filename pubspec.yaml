name: ponto_mobile
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  dio: ^5.4.0           
  geolocator: ^10.1.0   
  camera: ^0.10.5+8     

  cupertino_icons: ^1.0.6
  flutter_input_formatter: ^0.0.5
  intl: ^0.19.0
  url_launcher: ^6.2.5

  hive_flutter: 1.1.0        
  connectivity_plus: 5.0.2   

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  hive_generator: 1.1.3
  build_runner: 2.4.9

  # 🔒 CORRIGIDO: Força o Dart a varrer o repositório e pegar a versão exata que encaixa no seu SDK,
  # sem risco de quebrar ou dar erro de versão não encontrada.
  flutter_launcher_icons: any  
  
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21